#           - url: "http://backend:8000"
http:
  routers:
    secure-router:
      rule: "Host(`localhost`) || Host(`secure.local`) || Host(`backend.local`)"
      entryPoints:
        - websecure
      service: backend-service
      tls: {}

  services:
    backend-service:
      loadBalancer:
        servers:
          - url: "http://backend:80"
