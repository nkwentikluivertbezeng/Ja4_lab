# /etc/nginx/nginx.conf

worker_processes auto;

events {}

stream {
    resolver 127.0.0.11 valid=10s;

    # Accept TLS from browser
    server {
        listen 443;
        set $ja4_firewall ja4-firewall:443;

        # Forward raw TLS to JA4-firewall inside Docker network
        proxy_pass $ja4_firewall;

        # Optional: increase buffer size for ClientHello
        proxy_buffer_size 16k;
    }
}
